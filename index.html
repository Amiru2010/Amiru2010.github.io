<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Digital Clock</title>
  <link rel="icon" href="https://img.icons8.com/ios_filled/512/228BE6/clock.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color-light: #f0f0f0;
      --text-color-light: #333;
      --bg-color-dark: #121212;
      --text-color-dark: #f0f0f0;
      --accent-color: #00adb5;
    }

    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--bg-color-light);
      color: var(--text-color-light);
      transition: background-color 0.5s, color 0.5s;
    }

    body.dark {
      background-color: var(--bg-color-dark);
      color: var(--text-color-dark);
    }

    .clock {
      font-size: 5rem;
      margin-bottom: 1rem;
      transition: all 0.3s ease;
    }

    .date {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      opacity: 0.8;
    }

    .controls {
      display: flex;
      gap: 1rem;
    }

    button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: var(--accent-color);
      color: #fff;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #007b80;
    }

    @media (max-width: 600px) {
      .clock {
        font-size: 3rem;
      }

      .date {
        font-size: 1.2rem;
      }

      button {
        font-size: 0.9rem;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="clock" id="time">--:--:--</div>
  <div class="date" id="date">Loading date...</div>
  <div class="controls">
    <button id="toggleFormat">Switch to 24-hour</button>
    <button id="toggleTheme">Toggle Theme</button>
  </div>

  <script>
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const formatBtn = document.getElementById('toggleFormat');
    const themeBtn = document.getElementById('toggleTheme');

    let is24Hour = false;

    function updateClock() {
      const now = new Date();

      let hours = now.getHours();
      let minutes = now.getMinutes();
      let seconds = now.getSeconds();
      let ampm = '';

      if (!is24Hour) {
        ampm = hours >= 12 ? ' PM' : ' AM';
        hours = hours % 12 || 12;
      }

      const timeString = [
        hours.toString().padStart(2, '0'),
        minutes.toString().padStart(2, '0'),
        seconds.toString().padStart(2, '0')
      ].join(':') + (is24Hour ? '' : ampm);

      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateString = now.toLocaleDateString(undefined, options);

      timeEl.textContent = timeString;
      dateEl.textContent = dateString;
    }

    formatBtn.addEventListener('click', () => {
      is24Hour = !is24Hour;
      formatBtn.textContent = is24Hour ? 'Switch to 12-hour' : 'Switch to 24-hour';
      updateClock();
    });

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
