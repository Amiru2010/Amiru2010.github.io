<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link rel="icon" href="https://www.freeiconspng.com/uploads/calculator-icon-0.png" type="image/x-icon">
  <style>
    :root {
      --bg-color: #f0f0f0;
      --text-color: #000;
      --button-color: #e0e0e0;
      --button-hover: #d0d0d0;
      --accent: #4caf50;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #fff;
      --button-color: #333;
      --button-hover: #444;
      --accent: #81c784;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .calculator {
      width: 300px;
      background: var(--bg-color);
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      border-radius: 10px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .display {
      height: 60px;
      background: var(--button-color);
      border-radius: 5px;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      padding: 20px;
      font-size: 18px;
      border: none;
      border-radius: 5px;
      background: var(--button-color);
      color: var(--text-color);
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: var(--button-hover);
    }

    .equals {
      background: var(--accent);
      color: white;
    }

    .theme-toggle {
      margin-top: 10px;
      cursor: pointer;
      padding: 8px;
      border-radius: 5px;
      background: var(--button-color);
      text-align: center;
    }

    @media (max-width: 400px) {
      .calculator {
        width: 90%;
      }

      .display {
        font-size: 20px;
      }
    }
  </style>
</head>
<body data-theme="light">
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')">÷</button>
      <button onclick="appendValue('*')">×</button>
      <button onclick="appendValue('-')">−</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('+')">+</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button onclick="calculate()" class="equals" rowspan="2">=</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
      <button onclick="appendValue('.')">.</button>
    </div>
    <div class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Theme</div>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentInput = '';

    function appendValue(value) {
      if (display.textContent === '0' && value !== '.') {
        currentInput = '';
      }
      currentInput += value;
      display.textContent = currentInput;
    }

    function clearDisplay() {
      currentInput = '';
      display.textContent = '0';
    }

    function calculate() {
      try {
        const result = eval(currentInput);
        display.textContent = result;
        currentInput = result.toString();
      } catch (e) {
        display.textContent = 'Error';
        currentInput = '';
      }
    }

    function toggleTheme() {
      const body = document.body;
      const theme = body.getAttribute('data-theme');
      body.setAttribute('data-theme', theme === 'dark' ? 'light' : 'dark');
    }
  </script>
</body>
</html>
